# Local dev: docker compose up --build  ->  UI http://localhost  API http://localhost:8080
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/shop
      DB_USER: shop
      DB_PASSWORD: shop
      APP_CORS_ORIGIN: http://localhost
      APP_S3_ENABLED: ${APP_S3_ENABLED:-true}
      APP_S3_BUCKET: ${APP_S3_BUCKET:-bazario-app}
      APP_S3_REGION: ${APP_S3_REGION:-ap-south-1}
    depends_on:
      db: { condition: service_healthy }
    ports: ["8080:8080"]
  frontend:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_URL: "http://localhost:8080/api" }
    ports: ["80:3000"]
volumes:
  pgdata: {}
