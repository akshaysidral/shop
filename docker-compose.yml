# Local dev: docker compose up --build  ->  UI http://localhost  API http://localhost:8080
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/shop
      DB_USER: shop
      DB_PASSWORD: shop
      APP_CORS_ORIGIN: http://localhost
    depends_on:
      db: { condition: service_healthy }
    ports: ["8080:8080"]
  frontend:
    build:
      context: ./frontend
      args: { VITE_API_URL: http://localhost:8080/api }
    ports: ["80:80"]
volumes:
  pgdata: {}
