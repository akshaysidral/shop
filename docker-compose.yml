# Local dev: set DB_USER and DB_PASSWORD in .env, then docker compose up --build.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in your local .env file}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in your local .env file}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env file}
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?Set DB_USER in your local .env file}"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?Set POSTGRES_DB in your local .env file}
      DB_USER: ${DB_USER:?Set DB_USER in your local .env file}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env file}
      APP_CORS_ORIGIN: http://localhost
      AWS_PROFILE: ${AWS_PROFILE:-default}
      APP_S3_ENABLED: ${APP_S3_ENABLED:-false}
      APP_S3_BUCKET: ${APP_S3_BUCKET:-bazario-app}
      APP_S3_REGION: ${APP_S3_REGION:-ap-south-1}
      APP_S3_UPLOAD_URL_EXPIRATION_SECONDS: ${APP_S3_UPLOAD_URL_EXPIRATION_SECONDS:-300}
      APP_S3_READ_URL_EXPIRATION_SECONDS: ${APP_S3_READ_URL_EXPIRATION_SECONDS:-3600}
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
    depends_on:
      db: { condition: service_healthy }
    ports: ["8080:8080"]
  frontend:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_URL: "http://localhost:8080/api" }
    ports: ["80:3000"]
volumes:
  pgdata: {}
